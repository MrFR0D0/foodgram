volumes:
  postgres_data:
  static:
  media:


services:
  db:
    container_name: db_PostgreSQL
    build:
      context: ../db
      dockerfile: Dockerfile
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file: ../.env

  backend:
    container_name: backend_Django
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: always
    volumes:
      - static:/django_static/
      - media:/app/media/
    depends_on:
      - db
    env_file: ../.env

  # frontend:
  #   container_name: frontend_React
  #   build:
  #     context: ../frontend
  #     dockerfile: Dockerfile
  #   command: cp -r /app/build/. /static/
  #   env_file: ../.env
  #   volumes:
  #     - static:/static

  gateway:
    container_name: proxy_Nginx
    build:
      context: ../.
      dockerfile: nginx_local/Dockerfile

    ports:
      - 8000:80
    volumes:
      - static:/staticfiles
      - media:/media
    restart: always
    depends_on:
      - backend
      # - frontend
