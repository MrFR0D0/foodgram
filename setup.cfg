[flake8]
ignore =
    W503,
    F811,
    D100, D101, D102, D103, D104, D105, D106,
exclude =
    tests/,
    */migrations/,
    data/
    venv/,
    */venv/,
    env/,
    */env/,
    docs/,
    frontend/,
    infra/
per-file-ignores =
    */settings.py:E501
inline_quotes = single


[isort]
profile = black
line_length = 79
skip = 
    migrations,
    venv
known_first_party = 
    api,
    foodgram_backend,
    recipes,
    users
