[flake8]
ignore =
    W503
exclude =
    tests/,
    */migrations/,
    data/
    venv/,
    env/,
    docs/,
    frontend/,
    infra/
per-file-ignores =
    */settings.py:E501

# [isort]
# src_paths=foodgram

[isort]
profile = black
line_length = 88
known_third_party = django, flask
known_first_party = foodgram
sections = FUTURE,STDLIB,THIRDPARTY,FIRSTPARTY,LOCALFOLDER